name: macOS build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build smcled
        run: swiftc -O smcled.swift -framework IOKit -o smcled
      - name: Build standalone Intel research probe (compile only, no SMC writes)
        run: swiftc -O smcled-intel-lsoo-probe.swift -framework IOKit -o intel-sil-probe
      - name: Run hardware-free compatibility tests
        run: ./smcled --compatibility-self-test
      - name: Verify CLI help
        run: ./smcled --help
      - name: Check help lines fit a standard Terminal
        run: |
          ./smcled --help | awk 'length($0) > 80 { printf "Help line %d too wide (%d columns)\\n", NR, length($0); bad=1 } END { exit bad }'
